[package]
name = "nostr_nif"
version = "0.45.4"
edition = "2021"

[lib]
name = "nostr_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nostr = { version = "0.45.4", features = ["std", "nip04", "nip44", "nip46", "os-rng"], default-features = false }
bip39 = "2.0"
bitcoin = "0.30"
hex = "0.4"
rand = "0.8"
